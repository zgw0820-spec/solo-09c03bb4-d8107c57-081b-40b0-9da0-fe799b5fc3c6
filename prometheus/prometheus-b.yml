# Prometheus replica B
global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    cluster: demo
    replica: B

remote_write:
  - url: http://receiver:8000/api/v1/write
    remote_timeout: 10s
    # Pin Remote Write 1.0 (snappy-compressed protobuf, ordinary samples).
    protocol_version: 1.0
    queue_config:
      capacity: 500
      max_shards: 4
      min_shards: 1
      max_samples_per_send: 100
      batch_send_deadline: 2s

scrape_configs:
  - job_name: demo
    static_configs:
      - targets: ["demo:9100"]
